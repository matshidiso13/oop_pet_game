<!DOCTYPE html>
<html>
<head>
  <title>Virtual Pet</title>
  <style>
    #game { margin-top: 20px; }
    .pet { width: 200px; cursor: pointer; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <h1>🐶 🐈 Pet Clicker Game</h1>
  <p>pick your pet</p>
  <button onclick="choosePet('dog')">Dog</button>
  <button onclick="choosePet('cat')">Cat</button>

  <div id="game" style="display: none;">
    <img id="petImage" class="pet" src="" alt="pet" onclick="playWithPet()" />
    <div id="counter">Times played: 0</div>
    <div id="actions"></div>
  </div>

  <script>
    class Pet {
      constructor(name, sound, image) {
        this.name = name;
        this.sound = sound;
        this.image = image;
        this.playCount = 0;
      }

      speak() {
        alert(this.sound);
      }

      play() {
        this.playCount++;
        this.speak();
        updateCounter(this.playCount);
        showFunActions(this.name);
      }
    }

    let currentPet = null;

    function choosePet(type) {
      if (type === 'dog') {
        currentPet = new Pet('Dog', 'Woof! 🐶', 'img/image.png');
      } else {
        currentPet = new Pet('Cat', 'Meow! 🐱', 'img/image copy.png');
      }

      document.getElementById('petImage').src = currentPet.image;
      document.getElementById('game').style.display = 'block';
      updateCounter(0);
      showFunActions(currentPet.name);
    }

    function playWithPet() {
      if (currentPet) {
        currentPet.play();
      }
    }

    function updateCounter(count) {
      document.getElementById('counter').innerText = `Times played: ${count}`;
    }

    function showFunActions(petName) {
      const actions = petName === 'Dog'
        ? ['Bark', 'Wag Tail', 'Fetch Ball']
        : ['Meow', 'Purr', 'Chase Mouse'];

      const actionBox = document.getElementById('actions');
      actionBox.innerHTML = '<strong>Fun Actions:</strong><br>';

      for (let i = 0; i < actions.length; i++) {
        actionBox.innerHTML += '✅ ' + actions[i] + '<br>';
      }
    }
  </script>

</body>
</html>
